<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Shayari Gallery</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #ffe0f0, #e6dcfc, #d0e8ff);
        overflow: hidden;
        perspective: 1000px;
        margin: 0;
      }
      .gallery {
        position: relative;
        width: 300px;
        height: 400px;
        transform-style: preserve-3d;
        opacity: 0;
      }
      .photo {
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        transform-origin: center;
        backface-visibility: hidden;
        transition: transform 1s ease-in-out;
      }
      .photo span {
        position: absolute;
        bottom: 10%;
        width: 80%;
        left: 5%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        text-align: center;
        padding: 10px;
        border-radius: 5px;
        font-size: 1.2rem;
        font-weight: bold;
      }
      @keyframes rotateLeft {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(-360deg);
        }
      }

      #gallery {
        animation: rotateLeft 30s linear infinite;
      }

      @media (max-width: 600px) {
        .gallery {
          width: 250px;
          height: 330px;
        }
        .photo span {
          font-size: 1rem;
        }
      }
      .rose-rain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .petal {
        position: absolute;
        top: -10px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <body>
    <div class="gallery" id="gallery"></div>
    <div class="rose-rain"></div>
    <script>
      const shayaris = [
        "🌸 रंगों की बरसात हो, गुलाल की बौछार हो, होली का ये त्योहार हो! 🎨🎊",
        "💦 पिचकारी की धार, गुलाल की फुहार, होली का त्योहार लाए खुशियों की बहार! 🌈🥳",
        "🎨 गुलाल की हलचल और रंगों की बहार, होली लाए खुशियों की बौछार! 🌟🌺",
        "🌿 रंग बरसे भीगे चुनर वाली, रंग बरसे! होली मुबारक हो सबको! 🎶🎉",
        "🌷 होली का रंग आपकी जिंदगी को सुखद बनाए, हर दिन खुशियों से भरा हो! 💖🎊",
        "😃 बुरा ना मानो होली है! दोस्तों के संग होली का मस्ती भरा रंग है! 🌈🤩",
        "💖 गुलाबी रंग आपके गालों पे हो, नीला आसमान आपके सर पे हो! होली मुबारक! 🎨✨",
      ];

      const gallery = document.getElementById("gallery");
      const totalImages = shayaris.length;

      shayaris.forEach((shayari, index) => {
        const photo = document.createElement("div");
        photo.className = "photo";
        photo.style.backgroundImage = `url('image${index + 1}.jpg')`;

        const angle = index * (360 / totalImages);
        photo.style.transform = `rotateY(${angle}deg) translateZ(360px)`; // Negative angle for left rotation

        const span = document.createElement("span");
        span.textContent = shayari;

        photo.appendChild(span);
        gallery.appendChild(photo);
      });

      gsap.fromTo(
        "#gallery",
        { x: "-100vw", opacity: 0 },
        {
          x: "0vw",
          opacity: 1,
          duration: 2,
          ease: "power2.out",
          onComplete: () => {
            gsap.to(".gallery", {
              rotationY: 360,
              duration: 20,
              repeat: -1,
              ease: "linear",
            });
          },
        }
      );

      const roseRain = document.querySelector(".rose-rain");
      function createPetal() {
        const petal = document.createElement("img");
        petal.src = "rose-petal.png";
        petal.className = "petal";

        const randomSize = Math.random() * 20 + 15;
        petal.style.width = randomSize + "px";
        petal.style.left = Math.random() * window.innerWidth + "px";

        roseRain.appendChild(petal);

        gsap.to(petal, {
          y: window.innerHeight,
          rotation: 360,
          scale: 0.8,
          duration: 10,
          ease: "linear",
          onComplete: () => petal.remove(),
        });
      }
      setInterval(createPetal, 300);
    </script>
  </body>
</html>
